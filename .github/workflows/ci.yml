name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default for GITHUB_TOKEN; jobs opt into more only if needed.
permissions:
  contents: read

jobs:
  validate:
    name: Validate manifests + placeholders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install jq + envsubst (gettext)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq gettext

      - name: Shell syntax check
        run: |
          bash -n setup.sh
          bash -n uninstall.sh
          bash -n scripts/lint-forbidden.sh
          bash -n scripts/validate-placeholders.sh
          bash -n scripts/check-no-local-leak.sh
          bash -n scripts/githooks/pre-commit
          bash -n hooks/first-run-check.sh

      - name: No local install state committed
        run: |
          # Server-side backstop: a contributor's gitignored config.json /
          # answers/* must never be tracked (catches a forced `git add -f`).
          bad=$(git ls-files | grep -E '^(config\.json$|answers/last-run\.)' || true)
          if [ -n "$bad" ]; then
            echo "FAIL: local install state is tracked — these must stay gitignored:"
            echo "$bad" | sed 's/^/  /'
            exit 1
          fi
          echo "✓ no local config / answers files tracked"

      - name: Validate config.example.json against schema
        run: |
          # Cheap sanity check — jq parses successfully + all required leaf keys present.
          jq -e . config.example.json > /dev/null
          jq -e . config.schema.json > /dev/null
          echo "✓ JSON files parse"

      - name: Validate placeholders (every {{TOKEN}} in templates is declared in config.example.json)
        run: bash scripts/validate-placeholders.sh

      - name: Dry-run install — single-repo (the default config)
        run: |
          # Render against the example config to confirm the install path
          # doesn't error. Output goes to a scratch dir, not the runner's real $HOME.
          TMPHOME=$(mktemp -d)
          mkdir -p "$TMPHOME/.claude/skills" "$TMPHOME/.claude/agents"
          echo '{"hooks":{}}' > "$TMPHOME/.claude/settings.json"
          jq --arg home "$TMPHOME" --arg skills "$TMPHOME/.claude/skills" \
             '.codebase.user_home = $home | .codebase.skills_root = $skills' \
             config.example.json > "$TMPHOME/test-config.json"
          HOME="$TMPHOME" bash setup.sh --config "$TMPHOME/test-config.json"
          SKILL_COUNT=$(ls "$TMPHOME/.claude/skills/" | wc -l)
          UNFILLED=$(grep -rEoh '\{\{[A-Z_]+\}\}' "$TMPHOME/.claude/skills/" 2>/dev/null | sort -u | wc -l)
          echo "Single-repo: installed $SKILL_COUNT skills, $UNFILLED unfilled placeholders"
          [ "$SKILL_COUNT" -ge 21 ] || { echo "FAIL: expected >=21 skills installed"; exit 1; }
          [ "$UNFILLED" -eq 0 ]    || { echo "FAIL: $UNFILLED unfilled placeholders in rendered output"; exit 1; }
          jq -e 'length == 1' "$TMPHOME/.claude/skills/qship/repos.json" >/dev/null || { echo "FAIL: expected 1 repo in repos.json"; exit 1; }

      - name: Dry-run install — multi-repo (3-service synthetic config)
        run: |
          # Exercise the flexible repos[] path with a 3-service monorepo shape:
          # one service with migrations, one without, one library. Catches any
          # regressions where the rendered output assumes a fixed shape.
          # The 21-skill pipeline core installs unconditionally regardless of repo shape.
          TMPHOME=$(mktemp -d)
          mkdir -p "$TMPHOME/.claude/skills" "$TMPHOME/.claude/agents"
          echo '{"hooks":{}}' > "$TMPHOME/.claude/settings.json"
          jq --arg home "$TMPHOME" --arg skills "$TMPHOME/.claude/skills" \
             '.codebase.user_home = $home | .codebase.skills_root = $skills
              | .repos = [
                  {name: "users-api",  kind: "service", schema: "users",   package: null, has_migrations: true,  runs_locally: true,  is_primary: true,  port: 8000},
                  {name: "billing-api", kind: "service", schema: "billing", package: null, has_migrations: true,  runs_locally: true,  is_primary: false, port: 8001},
                  {name: "shared-lib",  kind: "library", schema: null,      package: null, has_migrations: false, runs_locally: false, is_primary: false, port: null}
                ]
             ' \
             config.example.json > "$TMPHOME/multi-repo-config.json"
          HOME="$TMPHOME" bash setup.sh --config "$TMPHOME/multi-repo-config.json"
          SKILL_COUNT=$(ls "$TMPHOME/.claude/skills/" | wc -l)
          UNFILLED=$(grep -rEoh '\{\{[A-Z_]+\}\}' "$TMPHOME/.claude/skills/" 2>/dev/null | sort -u | wc -l)
          REPO_COUNT=$(jq -r 'length' "$TMPHOME/.claude/skills/qship/repos.json")
          PRIMARY=$(jq -r '(.[] | select(.is_primary==true) | .name)' "$TMPHOME/.claude/skills/qship/repos.json")
          echo "Multi-repo: installed $SKILL_COUNT skills, $UNFILLED unfilled placeholders, $REPO_COUNT repos in repos.json, primary=$PRIMARY"
          [ "$SKILL_COUNT" -ge 21 ] || { echo "FAIL: expected >=21 skills installed"; exit 1; }
          [ "$UNFILLED" -eq 0 ]    || { echo "FAIL: $UNFILLED unfilled placeholders"; exit 1; }
          [ "$REPO_COUNT" -eq 3 ]  || { echo "FAIL: expected 3 repos in repos.json"; exit 1; }
          [ "$PRIMARY" = "users-api" ] || { echo "FAIL: primary should be users-api, got $PRIMARY"; exit 1; }
          # Verify {{PRIMARY_REPO_NAME}} resolved to users-api everywhere
          grep -r 'users-api' "$TMPHOME/.claude/skills/qcheck/" >/dev/null || { echo "FAIL: PRIMARY_REPO_NAME not rendered in qcheck"; exit 1; }
          # qshipmaster ships in the core pipeline (always installed)
          [ -d "$TMPHOME/.claude/skills/qshipmaster" ] || { echo "FAIL: qshipmaster (core) not installed"; exit 1; }
          [ "$SKILL_COUNT" -eq 21 ] || { echo "FAIL: expected exactly 21 skills, got $SKILL_COUNT"; exit 1; }


      - name: Dry-run install — tracker=none (no Atlassian MCP)
        run: |
          # A user with no Jira must still get a clean install whose ticket-driven
          # skills are wired for the inline/file path (not the Atlassian MCP).
          TMPHOME=$(mktemp -d)
          mkdir -p "$TMPHOME/.claude/skills" "$TMPHOME/.claude/agents"
          echo '{"hooks":{}}' > "$TMPHOME/.claude/settings.json"
          jq --arg home "$TMPHOME" --arg skills "$TMPHOME/.claude/skills" \
             '.codebase.user_home = $home | .codebase.skills_root = $skills
              | .tracker.tracker_type = "none" | .tracker.atlassian_cloud_id = ""' \
             config.example.json > "$TMPHOME/none.json"
          HOME="$TMPHOME" bash setup.sh --config "$TMPHOME/none.json"
          UNFILLED=$(grep -rEoh '\{\{[A-Z_]+\}\}' "$TMPHOME/.claude/skills/" 2>/dev/null | sort -u | wc -l | tr -d ' ')
          [ "$UNFILLED" -eq 0 ] || { echo "FAIL: $UNFILLED unfilled placeholders in tracker=none install"; exit 1; }
          grep -q 'tracker = none' "$TMPHOME/.claude/skills/qship/SKILL.md" || { echo "FAIL: tracker=none not rendered into qship"; exit 1; }
          grep -q 'case "none" in' "$TMPHOME/.claude/skills/qship/hooks/qship-persist.sh" || { echo "FAIL: persist hook not wired for tracker=none"; exit 1; }
          test -f "$TMPHOME/.claude/skills/qship/references/tracker-contract.md" || { echo "FAIL: tracker-contract.md (single source of truth) not installed"; exit 1; }
          # rendered persist hook must be valid bash in none mode
          bash -n "$TMPHOME/.claude/skills/qship/hooks/qship-persist.sh" || { echo "FAIL: rendered persist hook has a syntax error"; exit 1; }
          echo "✓ tracker=none install renders the no-MCP / inline-ticket path + contract file"

      - name: Codex linking — flag respected, isolated to CODEX_HOME, no clobber
        run: |
          # Regression test for two Codex-linking bugs fixed in 1.0.1:
          #  (1) codex_integration_enabled:false must actually skip linking.
          #  (2) linking must honour CODEX_HOME (never the real ~/.codex) and
          #      back up a pre-existing non-qship symlink instead of clobbering it.
          set -euo pipefail

          # (1) flag=false => no linking, even though a Codex dir exists.
          TMPHOME=$(mktemp -d); CODEX=$(mktemp -d)
          mkdir -p "$TMPHOME/.claude/skills" "$TMPHOME/.claude/agents" "$CODEX/skills"
          echo '{"hooks":{}}' > "$TMPHOME/.claude/settings.json"
          jq --arg home "$TMPHOME" --arg skills "$TMPHOME/.claude/skills" \
             '.codebase.user_home=$home | .codebase.skills_root=$skills | .features.codex_integration_enabled=false' \
             config.example.json > "$TMPHOME/cfg-false.json"
          HOME="$TMPHOME" CODEX_HOME="$CODEX" bash setup.sh --config "$TMPHOME/cfg-false.json" >/dev/null
          if [ -n "$(ls -A "$CODEX/skills")" ]; then
            echo "FAIL: codex_integration_enabled=false still created links:"; ls -A "$CODEX/skills"; exit 1
          fi
          echo "✓ flag=false => no Codex links created"

          # (2) flag=true => links land in CODEX_HOME; pre-existing non-qship link preserved.
          TMPHOME=$(mktemp -d); CODEX=$(mktemp -d)
          mkdir -p "$TMPHOME/.claude/skills" "$TMPHOME/.claude/agents" "$CODEX/skills"
          echo '{"hooks":{}}' > "$TMPHOME/.claude/settings.json"
          ln -s /some/unrelated/qcheck "$CODEX/skills/qcheck"   # a link the user already had
          jq --arg home "$TMPHOME" --arg skills "$TMPHOME/.claude/skills" \
             '.codebase.user_home=$home | .codebase.skills_root=$skills | .features.codex_integration_enabled=true' \
             config.example.json > "$TMPHOME/cfg-true.json"
          HOME="$TMPHOME" CODEX_HOME="$CODEX" bash setup.sh --config "$TMPHOME/cfg-true.json" >/dev/null
          [ ! -e "$TMPHOME/.codex" ] || { echo "FAIL: linking leaked into \$HOME/.codex"; exit 1; }
          [ -L "$CODEX/skills/qship" ] || { echo "FAIL: qship link not created under CODEX_HOME"; exit 1; }
          [ "$(readlink "$CODEX/skills/qship")" = "$TMPHOME/.claude/skills/qship" ] || { echo "FAIL: qship link target wrong"; exit 1; }
          ls "$CODEX/skills"/qcheck.bak.* >/dev/null 2>&1 || { echo "FAIL: pre-existing qcheck was not backed up"; exit 1; }
          [ "$(readlink "$CODEX"/skills/qcheck.bak.*)" = "/some/unrelated/qcheck" ] || { echo "FAIL: backup lost original target"; exit 1; }
          echo "✓ flag=true => isolated to CODEX_HOME, real \$HOME/.codex untouched, non-qship link backed up"

      - name: Phase 3 heading normalization — near-miss heals, substance still gates
        run: |
          # A cosmetic Phase 3 heading slip must not HALT a wave/epic whose
          # /qe2etest substance is real, but normalization must NOT let a
          # mislabeled pytest-only section through (it relaxes no substance gate).
          set -euo pipefail
          TMPHOME=$(mktemp -d)
          mkdir -p "$TMPHOME/.claude/skills" "$TMPHOME/.claude/agents"
          echo '{"hooks":{}}' > "$TMPHOME/.claude/settings.json"
          jq --arg home "$TMPHOME" --arg skills "$TMPHOME/.claude/skills" \
             '.codebase.user_home=$home | .codebase.skills_root=$skills' \
             config.example.json > "$TMPHOME/cfg.json"
          HOME="$TMPHOME" bash setup.sh --config "$TMPHOME/cfg.json" >/dev/null
          LIB="$TMPHOME/.claude/skills/qship/hooks/qship-evidence-lib.sh"
          D=$(mktemp -d)
          printf '## Phase 3 E2E\nRan /qe2etest.\n| S1 | qe2etest:GET /a | a.txt | PASS |\n' > "$D/near.md"
          printf '## Phase 3 Tests\n| S1 | pytest tests/x.py | o.txt | PASS |\n'          > "$D/pytest.md"
          printf '## Phase 30 Roadmap\nnot a phase-3 heading\n'                           > "$D/p30.md"
          source "$LIB"
          # near-miss + real substance → heading heals AND validates
          normalize_phase3_heading "$D/near.md"
          grep -qF '## Phase 3 — /qe2etest evidence' "$D/near.md" || { echo "FAIL: near-miss heading not normalized"; exit 1; }
          validate_qe2etest_evidence "$D/near.md" near || { echo "FAIL: normalized near-miss with real substance should validate"; exit 1; }
          # mislabeled pytest-only → heading rewritten BUT substance still rejects
          normalize_phase3_heading "$D/pytest.md"
          if validate_qe2etest_evidence "$D/pytest.md" pytest 2>/dev/null; then
            echo "FAIL: pytest-only section passed after normalization — substance gate broken"; exit 1
          fi
          # "Phase 30" must be left untouched (word-boundary guard)
          normalize_phase3_heading "$D/p30.md"
          grep -qF '## Phase 30 Roadmap' "$D/p30.md" || { echo "FAIL: 'Phase 30' wrongly rewritten"; exit 1; }
          echo "✓ near-miss heading heals + validates; pytest-only still rejected; 'Phase 30' untouched"

      - name: Phase 3 invocation citation — proven run heals near-miss, missing log never fabricates
        run: |
          # A worker can run /qe2etest for real (tee'ing output to the wave log)
          # yet describe it without the literal token ("qe2etest trace",
          # "wave-N-qe2etest.log"). Gated on the run-log, inject a truthful
          # citation so SUBSTANCE decides — but with NO log, never fabricate one.
          set -euo pipefail
          TMPHOME=$(mktemp -d)
          mkdir -p "$TMPHOME/.claude/skills" "$TMPHOME/.claude/agents"
          echo '{"hooks":{}}' > "$TMPHOME/.claude/settings.json"
          jq --arg home "$TMPHOME" --arg skills "$TMPHOME/.claude/skills" \
             '.codebase.user_home=$home | .codebase.skills_root=$skills' \
             config.example.json > "$TMPHOME/cfg.json"
          HOME="$TMPHOME" bash setup.sh --config "$TMPHOME/cfg.json" >/dev/null
          LIB="$TMPHOME/.claude/skills/qship/hooks/qship-evidence-lib.sh"
          D=$(mktemp -d)
          ev() { printf '## Phase 3 — /qe2etest evidence\nqe2etest production-trigger trace; see wave-2-qe2etest.log.\n| S1 | qe2etest:GET /a | a.txt | PASS |\n' > "$1"; }
          source "$LIB"
          # proven run (non-empty log): near-miss invocation must HALT before, heal after
          ev "$D/withlog.md"; echo 'real /qe2etest output' > "$D/withlog.log"
          validate_qe2etest_evidence "$D/withlog.md" w 2>/dev/null && { echo "FAIL: should reject the invocation near-miss before citation"; exit 1; }
          ensure_qe2etest_citation "$D/withlog.md" "$D/withlog.log"
          validate_qe2etest_evidence "$D/withlog.md" w || { echo "FAIL: proven-run near-miss should validate after citation"; exit 1; }
          # no run-log: must NOT inject, must still reject (never fabricate a run)
          ev "$D/nolog.md"
          ensure_qe2etest_citation "$D/nolog.md" "$D/nolog.log"
          grep -qE 'Skill\(skill="qe2etest"\)' "$D/nolog.md" && { echo "FAIL: injected a citation with no run-log"; exit 1; }
          if validate_qe2etest_evidence "$D/nolog.md" n 2>/dev/null; then echo "FAIL: no-log near-miss must not pass"; exit 1; fi
          echo "✓ proven run heals invocation near-miss; missing log never fabricates; substance still gates"

      - name: Phase 3 PASS-verdict normalization — SHIPPABLE heals, hedged prose never fabricates
        run: |
          # A real /qe2etest pass recorded as "Verdict: SHIPPABLE" + decorated
          # PASS cells must validate; a hedged verdict with no SHIPPABLE must NOT
          # be turned into a PASS (no fabrication).
          set -euo pipefail
          TMPHOME=$(mktemp -d); mkdir -p "$TMPHOME/.claude/skills" "$TMPHOME/.claude/agents"
          echo '{"hooks":{}}' > "$TMPHOME/.claude/settings.json"
          jq --arg home "$TMPHOME" --arg skills "$TMPHOME/.claude/skills" \
             '.codebase.user_home=$home | .codebase.skills_root=$skills' \
             config.example.json > "$TMPHOME/cfg.json"
          HOME="$TMPHOME" bash setup.sh --config "$TMPHOME/cfg.json" >/dev/null
          LIB="$TMPHOME/.claude/skills/qship/hooks/qship-evidence-lib.sh"
          D=$(mktemp -d); source "$LIB"
          # SHIPPABLE + decorated PASS cells + run-log → must heal + validate
          printf '## Phase 3 — /qe2etest evidence\nRan /qe2etest.\n| S1 | qe2etest:GET /a | a.txt | PASS (verified) |\nVerdict: SHIPPABLE\n' > "$D/ship.md"
          echo 'real /qe2etest output' > "$D/ship.log"
          validate_qe2etest_evidence "$D/ship.md" s 2>/dev/null && { echo "FAIL: decorated PASS should reject before heal"; exit 1; }
          ensure_qe2etest_pass_summary "$D/ship.md" "$D/ship.log"
          validate_qe2etest_evidence "$D/ship.md" s || { echo "FAIL: SHIPPABLE + log should validate after heal"; exit 1; }
          # hedged verdict, NO SHIPPABLE → must NOT fabricate a PASS
          printf '## Phase 3 — /qe2etest evidence\nRan /qe2etest.\n| S1 | qe2etest:GET /a | a.txt | PASS (verified) |\nVerdict: Ready with caveats\n' > "$D/hedge.md"
          echo 'real /qe2etest output' > "$D/hedge.log"
          ensure_qe2etest_pass_summary "$D/hedge.md" "$D/hedge.log"
          grep -qiE 'all scenarios PASS' "$D/hedge.md" && { echo "FAIL: fabricated a PASS from hedged prose"; exit 1; }
          echo "✓ SHIPPABLE+log heals decorated PASS; hedged prose never fabricates"

      - name: No Perl regex escapes in awk / POSIX grep (BUG-5 rule)
        run: |
          # \b \d \w \s fail SILENTLY in awk and BSD/POSIX grep, so a guard that
          # uses them no-ops without erroring. Forbid them in executable shell
          # (full-line comments + the one python re.search line are exempt).
          hits=$(grep -rnE '\\[bdwsBDWS]' templates/skills --include='*.sh' \
                  | grep -vE ':[0-9]+:[[:space:]]*#' | grep -v 're\.S' || true)
          if [ -n "$hits" ]; then
            echo "FAIL: Perl regex escape in awk/grep code — use POSIX classes"
            echo "      ([[:space:]], [[:digit:]], ([^0-9]|\$), (^|[^[:alnum:]]) …):"
            echo "$hits"
            exit 1
          fi
          echo "✓ no Perl escapes (\\b \\d \\w \\s) in awk/POSIX-grep code"

      - name: Validate eval scaffold (fixtures + rubric)
        run: bash scripts/eval.sh --check

      - name: Plugin manifest validation (Claude Code v2.x format)
        run: |
          # claude plugin validate requires the Claude Code CLI which isn't on
          # GitHub-hosted runners.  Instead do a shape-only check via jq.
          jq -e '.name and .plugins and .owner.name' .claude-plugin/marketplace.json > /dev/null
          jq -e '.name and .version' .claude-plugin/plugin.json > /dev/null
          echo "✓ Plugin manifests have required keys"

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0          # full history so gitleaks scans every commit
      - name: gitleaks (pinned binary)
        # Run the gitleaks binary directly instead of gitleaks-action@v2.
        # The action calls GET /repos/.../pulls/:n/commits, which 403s
        # ("Resource not accessible by integration") unless the workflow token
        # is granted pull-requests: read — an avoidable failure mode. Running
        # the binary in `git` mode scans full history with no API calls, and is
        # the exact command maintainers validate locally, so CI == local.
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version
          ./gitleaks git . --no-banner --redact --exit-code 1
